services:
  db:
    image: postgres:16-alpine
    container_name: lorcana-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - lorcana-db-data:/var/lib/postgresql/data

volumes:
  lorcana-db-data: